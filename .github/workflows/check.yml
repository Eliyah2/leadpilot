# Controleert elke push en pull request.
# Faalt de controle, dan zie je in de Actions-tab precies welke stap misging.
name: Controle

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Syntax, templates en API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node 20 klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dit project heeft geen dependencies (geen npm install nodig).
      - name: Versie tonen
        run: node --version

      - name: Syntaxcontrole van alle JavaScript
        run: |
          set -e
          find api public/js scripts -name '*.js' -o -name '*.mjs' | sort | while read -r file; do
            node --check "$file"
          done
          node --check public/sw.js
          echo "Syntaxcontrole geslaagd."

      - name: Controle van templates, e-mails, CSV en API-routes
        run: node scripts/validate.mjs

      # Zo weet je zeker dat er geen sleutel in de repository is beland.
      - name: Controleren op geheime bestanden
        run: |
          if find . -name '.env' -not -path './node_modules/*' | grep -q .; then
            echo "::error::Er staat een .env-bestand in de repository. Verwijder het en zet je sleutels in Vercel."
            exit 1
          fi
          echo "Geen .env-bestand gevonden."
